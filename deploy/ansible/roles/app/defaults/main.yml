---
bia_app_service_name: bia-quiz
bia_app_binary: /opt/bia-quiz/bia-quiz
bia_app_config: /etc/bia-quiz/bia.toml
bia_app_service_src: "{{ playbook_dir }}/../bia-quiz.service"

# The binary is a release artifact; leave this false if you deploy it
# separately, or set true to copy target/release/bia-quiz from the controller.
bia_app_copy_binary: false
bia_app_binary_src: "{{ playbook_dir }}/../../target/release/bia-quiz"
