---
- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/bia-quiz
    - /etc/bia-quiz

- name: Create the backup directory
  ansible.builtin.file:
    path: /var/lib/bia-quiz/backups
    state: directory
    owner: bia-quiz
    group: bia-quiz
    mode: "0750"

- name: Copy the application binaries
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - { src: "{{ bia_app_binary_src }}", dest: "{{ bia_app_binary }}" }
    - { src: "{{ bia_app_import_src }}", dest: /opt/bia-quiz/bia-import }
  when: bia_app_copy_binary | bool
  notify: Restart bia-quiz

- name: Check for a staged app config
  ansible.builtin.stat:
    path: "{{ bia_app_config_src }}"
  delegate_to: localhost
  become: false
  register: bia_app_staged_config

- name: Install the staged app config
  ansible.builtin.copy:
    src: "{{ bia_app_config_src }}"
    dest: "{{ bia_app_config }}"
    owner: root
    group: bia-quiz
    mode: "0640"
  when: bia_app_staged_config.stat.exists
  notify: Restart bia-quiz

- name: Check the application binary and config
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ bia_app_binary }}"
    - "{{ bia_app_config }}"
  register: bia_app_files

- name: Require the binary and config before starting the service
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: >-
      Missing {{ item.item }}. Run `make artefacts` and deploy the config as
      described in deploy/README.md §4.
  loop: "{{ bia_app_files.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Install the bia-quiz systemd unit
  ansible.builtin.copy:
    src: "{{ bia_app_service_src }}"
    dest: /etc/systemd/system/{{ bia_app_service_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart bia-quiz

- name: Enable and start bia-quiz
  ansible.builtin.systemd:
    name: "{{ bia_app_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
