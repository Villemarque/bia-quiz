---
- name: Install sudo when a managed user needs it
  ansible.builtin.apt:
    name: sudo
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: bia_users | selectattr('sudo', 'defined') | selectattr('sudo') | list | length > 0

- name: Create primary groups
  ansible.builtin.group:
    name: "{{ item.group }}"
    system: "{{ item.system | default(false) }}"
    state: present
  loop: "{{ bia_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.group is defined and item.group | length > 0

- name: Create users
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.group | default(omit) }}"
    groups: "{{ item.groups | default(omit) }}"
    append: "{{ item.append | default(omit) }}"
    system: "{{ item.system | default(false) }}"
    home: "{{ item.home | default(omit) }}"
    shell: "{{ item.shell | default(omit) }}"
    create_home: "{{ item.create_home | default(true) }}"
    state: present
  loop: "{{ bia_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set home directory ownership and mode
  ansible.builtin.file:
    path: "{{ item.home }}"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.group | default(omit) }}"
    mode: "{{ item.home_mode | default('0755') }}"
  loop: "{{ bia_users }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.home is defined
    - item.create_home | default(true)

- name: Install SSH authorized keys
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
  loop: "{{ bia_users | subelements('ssh_authorized_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Grant passwordless sudo to managed users
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  loop: "{{ bia_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.sudo | default(false)

- name: Remove sudoers files for managed users without sudo
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ bia_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: not (item.sudo | default(false))
