---
- name: Validate the SSH port
  ansible.builtin.assert:
    that:
      - bia_ssh_port | int >= 1
      - bia_ssh_port | int <= 65535
    fail_msg: "bia_ssh_port must be between 1 and 65535."
  when: bia_manage_ssh_port | bool

- name: Remove the legacy SSH drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-bia-quiz-port.conf
    state: absent
  when: bia_manage_ssh_port | bool
  notify: Restart SSH

- name: Comment active Port directives in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(\s*Port\s+.*)$'
    line: '# \1'
    backrefs: true
  when: bia_manage_ssh_port | bool
  notify: Restart SSH

- name: Comment active password-auth directives in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^(\s*(?:PasswordAuthentication|KbdInteractiveAuthentication|ChallengeResponseAuthentication)\s+.*)$'
    line: '# \1'
    backrefs: true
  when: bia_manage_ssh_port | bool
  notify: Restart SSH

- name: Configure the SSH daemon
  ansible.builtin.template:
    src: port.conf.j2
    dest: /etc/ssh/sshd_config.d/00-bia-quiz.conf
    owner: root
    group: root
    mode: "0644"
  when: bia_manage_ssh_port | bool
  notify: Restart SSH

- name: Validate the SSH daemon configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  when: bia_manage_ssh_port | bool

- name: Read the effective SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -T
  register: bia_sshd_effective
  changed_when: false
  when: bia_manage_ssh_port | bool

- name: Verify SSH password authentication is disabled
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in bia_sshd_effective.stdout"
      - "'kbdinteractiveauthentication no' in bia_sshd_effective.stdout"
    fail_msg: >-
      Effective sshd configuration still allows password authentication.
      SSH was not restarted; fix the config before closing your session.
  when:
    - bia_manage_ssh_port | bool
    - not bia_ssh_password_authentication | bool
