[workspace]
members = ["crates/core", "crates/server", "crates/importer"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
authors = ["BIA - Aerien Ambassadeurs Avenir (Triple A)"]
repository = "https://github.com/Villemarque/bia-quiz"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "macros"] }
axum-login = "0.18"
tower-sessions = { version = "0.14", features = ["signed"] }
argon2 = "0.5"
time = "0.3"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
diesel = { version = "2.3", default-features = false }
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
diesel_migrations = "2.3"
rust-embed = "8"
mime_guess = "2"
toml = "0.8"
rand = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
csv = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true

# Dev builds do not need debug info. Skipping its generation speeds up
# recompilation and shrinks target/debug; use `debug = 1` for line tables.
[profile.dev]
debug = 0
